# GitHub Actions 云编译：无需在本机安装 Android Studio / JDK / SDK
# 用法见 README「备选：不装 Android Studio」一节
name: Build APK

on:
  # 允许在 Actions 页面手动点按钮触发
  workflow_dispatch:
  # 也可以配置成推 tag 自动触发，例如 v1.0.0
  # push:
  #   tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: 编译 Debug APK
        run: gradle assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
